<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Be Gestion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <h1>Menú Principal</h1>
        <p>Bienvenido, <span id="user-name">Usuario</span>.</p>
        
        <div id="bono-quincenal-container" class="ranking-card">
        </div>

        <div id="strategic-performance-container" class="ranking-card" style="display: none;">
        </div>

        <div id="pipeline-container" class="ranking-card">
        </div>

        <div id="reach-ranking-container" class="ranking-card">
        </div>

        <div id="conversion-ranking-container" class="ranking-card">
        </div>

        <div id="follow-up-ranking-container" class="ranking-card" style="display: none;">
        </div>

        <nav class="nav-grid" id="menu-buttons-container">
        </nav>
        
        <a href="#" id="logout-btn" class="back-link" style="margin-top: 20px;">Cerrar Sesión</a>
    </div>
    
    <div id="team-pulse-panel" class="container mt-5" style="display: none;">
        <h2 class="text-center mb-4">Panel de Desempeño del Equipo</h2>
        <div class="row text-center">
            <div class="col-md-6 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">🎯 Tasa de Cierre del Equipo</h5>
                        <p class="display-4 fw-bold" id="team-closing-rate">--%</p>
                        <small class="text-muted">(Formalizaciones / Total de Visitas)</small>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">⏱️ Promedio de Seguimiento del Equipo</h5>
                        <p class="display-4 fw-bold" id="team-follow-up-average">-- días</p>
                        <small class="text-muted">(Promedio de tiempo sin visitar a un prospecto activo)</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/main.js"></script>

    </body>
</html>
