<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asesores - Admin</title>
    <link rel="stylesheet" href="/estilos.css">
    <link rel="stylesheet" href="/admin-estilos.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="/admin_menu.html" class="back-button">&larr; Volver al Menú</a>
            <h1>Gestión de Asesores</h1>
        </header>

        <main>
            <div class="card">
                <h2>Añadir Asesor</h2>
                <form id="add-advisor-form" class="form-group">
                    <label for="new-advisor-name">Nombre del Asesor:</label>
                    <input type="text" id="new-advisor-name" name="name" required placeholder="Escribe el nombre completo">
                    <button type="submit" class="btn">Añadir Asesor</button>
                </form>
                <hr>
                <h3>Asesores Actuales</h3>
                <ul id="advisor-list" class="resource-list"></ul>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('add-advisor-form');
            const input = document.getElementById('new-advisor-name');
            const list = document.getElementById('advisor-list');
            const API_URL = '/api/advisors';

            // Función para cargar y mostrar los asesores
            const fetchAndDisplayItems = async () => {
                try {
                    const response = await fetch(API_URL); 
                    if (!response.ok) throw new Error(`Error al obtener asesores.`);
                    const items = await response.json();
                    
                    list.innerHTML = '';
                    
                    if (items.length === 0) {
                        list.innerHTML = `<li>No hay asesores registrados.</li>`;
                        return;
                    }

                    items.forEach(item => {
                        const listItem = document.createElement('li');
                        
                        // Si el asesor está inactivo, le ponemos un estilo visual diferente
                        if (item.active === false) {
                            listItem.style.opacity = '0.5';
                            listItem.style.textDecoration = 'line-through';
                        }

                        listItem.textContent = item.name;
                        
                        const toggleButton = document.createElement('button');
                        // Cambiamos el texto del botón según el estado
                        toggleButton.textContent = item.active === false ? 'Activar' : 'Desactivar';
                        toggleButton.className = item.active === false ? 'btn-activate' : 'btn-delete';
                        
                        toggleButton.addEventListener('click', () => toggleItemStatus(item.id, item.active));
                        
                        listItem.appendChild(toggleButton);
                        list.appendChild(listItem);
                    });
                } catch (error) {
                    console.error(error);
                    list.innerHTML = `<li>Error al cargar asesores.</li>`;
                }
            };

            // Función para añadir un nuevo asesor
            const addItem = async (name) => {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name }),
                    });
                    if (!response.ok) throw new Error(`Error al añadir asesor.`);
                    input.value = '';
                    await fetchAndDisplayItems();
                } catch (error) {
                    console.error(error);
                    alert(`No se pudo añadir el asesor.`);
                }
            };

            // NUEVA FUNCIÓN CORREGIDA: Sin 'entityId' y con lógica de estado
            async function toggleItemStatus(id, currentStatus) {
                const accion = (currentStatus === false) ? 'activar' : 'desactivar';
                const confirmMessage = `¿Estás seguro de que deseas ${accion} a este asesor?\n\n(No se borrarán sus datos históricos).`;
                
                if (confirm(confirmMessage)) {
                    try {
                        // Llamada al servidor con el ID correcto
                        const response = await fetch(`${API_URL}/${id}/toggle-status`, {
                            method: 'PUT' // Usamos PUT porque es una actualización
                        });
                        
                        if (!response.ok) throw new Error('Error en la respuesta del servidor');
                        
                        await fetchAndDisplayItems(); // Recargar la lista
                    } catch (error) {
                        console.error('Error al cambiar estado:', error);
                        alert('No se pudo cambiar el estado del asesor.');
                    }
                }
            }

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                const name = input.value.trim();
                if (name) addItem(name);
            });

            fetchAndDisplayItems();
        });
    </script>
</body>
</html>
